[project]
name = "knowguard-backend"
version = "0.1.0"
description = "KnowGuard 智能知识库管理平台后端核心服务"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.28",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "pymilvus>=2.4.0",
    "motor>=3.3.0",
    "dashscope>=1.14.0",
    "sentence-transformers>=2.5.0",
    "torch>=2.2.0",
    "redis>=5.0.0",
    "celery>=5.3.6",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0,<2.0.0",
    "google-genai>=0.1.0",
    "scikit-learn>=1.4.0",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
